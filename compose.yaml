services:
  app:
    build: .
    ports:
      - "${PORT:-3002}:8000"
    env_file: .env
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl or wget, so use Python. A failed request exits non-zero.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
