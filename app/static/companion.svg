<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pip, a small star sprite">
  <!-- Original placeholder companion: a round star sprite. A parent upload (task 5b) can replace it. -->
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".55" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c9952f"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ddff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="#f5ebd3"/>
  <circle cx="22" cy="24" r="1.6" fill="#c9952f" opacity=".5"/>
  <circle cx="98" cy="30" r="1.2" fill="#c9952f" opacity=".5"/>
  <circle cx="102" cy="92" r="1.6" fill="#c9952f" opacity=".5"/>
  <!-- the star on her head -->
  <path d="M60 8 L65 22 L79 26 L65 30 L60 44 L55 30 L41 26 L55 22 Z" fill="url(#star)" stroke="#5b21b6" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="60" cy="74" rx="36" ry="34" fill="url(#body)" stroke="#9a6d1c" stroke-width="2"/>
  <!-- little arms -->
  <path d="M25 78 q-9 -2 -11 -10" fill="none" stroke="#9a6d1c" stroke-width="3" stroke-linecap="round"/>
  <path d="M95 78 q9 -2 11 -10" fill="none" stroke="#9a6d1c" stroke-width="3" stroke-linecap="round"/>
  <!-- face -->
  <ellipse cx="48" cy="70" rx="4.5" ry="6" fill="#3a2812"/>
  <ellipse cx="72" cy="70" rx="4.5" ry="6" fill="#3a2812"/>
  <circle cx="49.5" cy="67.5" r="1.6" fill="#fff"/>
  <circle cx="73.5" cy="67.5" r="1.6" fill="#fff"/>
  <ellipse cx="40" cy="82" rx="5" ry="3" fill="#f2a07b" opacity=".6"/>
  <ellipse cx="80" cy="82" rx="5" ry="3" fill="#f2a07b" opacity=".6"/>
  <path d="M53 84 q7 6 14 0" fill="none" stroke="#3a2812" stroke-width="2.4" stroke-linecap="round"/>
</svg>
